; Default graphics = the "High" preset of the in-game menu (CambridgeGameUserSettings):
; measured ~14-21 ms GPU on the M4 Pro at 1080p (mean 17 ms over 25 views, 2026-10-27), and dynamic resolution
; (bDynamicResolution, default on) holds the heavy views at 60 fps.
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2

[/Script/CambridgeRacer.CambridgeGameUserSettings]
bShowFPS=True
TreeDistance=1
GeometryDetail=1
TractionControlMode=1
bAutomaticGearbox=True
bABSEnabled=True
RacingLineMode=2
bShowMinimap=True
