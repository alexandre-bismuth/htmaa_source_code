[package]
name = "qpad-casino"
version = "0.1.0"
edition = "2021"

# The game (rules, drawing, screens) is a hardware-free library, so it is unit-tested on the computer:
#   ./test_host.sh        then flash with:   cargo run --release
[lib]
name = "casino"
path = "src/lib.rs"

[[bin]]
name = "qpad-casino"
path = "src/main.rs"
test = false
bench = false

[dependencies]
heapless = "0.8"

[target.'cfg(target_arch = "arm")'.dependencies]
seeeduino-xiao-rp2040 = "0.6"      # re-exports rp2040-hal as `hal`
cortex-m = "0.7"
cortex-m-rt = "0.7"
critical-section = "1.2"
embedded-hal = "1.0"
panic-halt = "0.2"
usb-device = "0.3"
usbd-serial = "0.2"

[profile.release]
opt-level = 2          # same level as the C++ build (-O2)
lto = true
codegen-units = 1
debug = 2              # symbols only; not flashed

[profile.dev]
opt-level = 1
